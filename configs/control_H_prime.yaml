# Selection-matched control H' (9,10,11), DP-SGD epsilon = 4.7
exp_name: control_H_prime
model_name: roberta-base
train_layers: "9,10,11"
freeze_embeddings: true
use_dp: true
target_epsilon: 4.7
target_delta: 1.0e-5
max_grad_norm: 1.0
lr: 1.0e-3
weight_decay: 0.0
# Pilot v2 ran 100 non-private head-warmup steps on the private split here; that stage was not
# covered by the DP accountant and has been removed. Public warmup: head_warmup_source: public_imdb
head_warmup_source: none
max_steps: 300
logical_batch_size: 64
physical_batch_size: 16
seed: 42
