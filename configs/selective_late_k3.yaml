# Selective late layers (9,10,11), DP-SGD epsilon = 5.0
exp_name: selective_late_k3
model_name: roberta-base
train_layers: "9,10,11"
freeze_embeddings: true
use_dp: true
target_epsilon: 5.0
target_delta: 1.0e-5
max_grad_norm: 1.0
lr: 3.0e-4
max_steps: 1000
logical_batch_size: 64
physical_batch_size: 16
seed: 42
